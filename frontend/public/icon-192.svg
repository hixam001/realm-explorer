<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="#050B14"/>
  <!-- Subtle glow circle -->
  <circle cx="96" cy="96" r="72" fill="none" stroke="#0891b2" stroke-width="1" opacity="0.3"/>
  <!-- Crossed swords icon -->
  <g transform="translate(96,96)" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sword 1: top-left to bottom-right -->
    <line x1="-38" y1="-38" x2="32" y2="32"/>
    <!-- Sword 1 guard -->
    <line x1="-18" y1="-14" x2="-14" y2="-18"/>
    <!-- Sword 2: top-right to bottom-left -->
    <line x1="38" y1="-38" x2="-32" y2="32"/>
    <!-- Sword 2 guard -->
    <line x1="18" y1="-14" x2="14" y2="-18"/>
  </g>
</svg>
